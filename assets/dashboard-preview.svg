<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">LLM Security Evaluation Lab dashboard preview</title><desc id="desc">Static synthetic dashboard preview for single-trace safeguards, repeated model evaluation, and longitudinal actor-risk intervention.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1020"/><stop offset="1" stop-color="#251b32"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">LLM Security Evaluation Lab</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">SAFEGUARDS · REPEATED EVALS · ACTOR-LEVEL RISK</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">SINGLE TRACE</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">SAFEGUARDS</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">MODEL ADAPTER</text><text x="343" y="184" font-size="24" font-weight="800" fill="#c4b5fd">REAL / MOCK</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">ACTOR RISK</text><text x="618" y="184" font-size="24" font-weight="800" fill="#f9a8d4">LONGITUDINAL</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">INTERVENTION</text><text x="893" y="184" font-size="21" font-weight="800" fill="#fbbf24">ALLOW → RESTRICT</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#141522" stroke="#403653"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Security graders</text><text x="72" y="298" font-size="12" fill="#94a3b8">Same deterministic contract for mock and real-model traces</text><circle cx="78" cy="343" r="6" fill="#a78bfa"/><text x="96" y="348" font-size="14" font-weight="650" fill="#e0e7ff">Prompt injection + data leakage</text><circle cx="78" cy="391" r="6" fill="#60a5fa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#e0e7ff">Tool authorization + attempted tool calls</text><circle cx="78" cy="439" r="6" fill="#f472b6"/><text x="96" y="444" font-size="14" font-weight="650" fill="#e0e7ff">Unsupported claims / hallucination checks</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492" font-size="14" font-weight="650" fill="#e0e7ff">Human approval on consequential actions</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#141522" stroke="#403653"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Longitudinal safeguard loop</text><text x="631" y="298" font-size="12" fill="#94a3b8">Session behavior accumulates without executing model-requested tools</text><rect x="631" y="332" width="100" height="48" rx="10" fill="#10291f" stroke="#166534"/><text x="681" y="361" text-anchor="middle" font-size="12" font-weight="800" fill="#4ade80">ALLOW</text><path d="M731 356 H780" stroke="#64748b" stroke-width="3"/><rect x="781" y="332" width="100" height="48" rx="10" fill="#302410" stroke="#a16207"/><text x="831" y="361" text-anchor="middle" font-size="12" font-weight="800" fill="#fbbf24">FRICTION</text><path d="M881 356 H930" stroke="#64748b" stroke-width="3"/><rect x="931" y="332" width="90" height="48" rx="10" fill="#29203c" stroke="#7e22ce"/><text x="976" y="361" text-anchor="middle" font-size="12" font-weight="800" fill="#e9d5ff">REVIEW</text><path d="M1021 356 H1050" stroke="#64748b" stroke-width="3"/><rect x="1051" y="332" width="72" height="48" rx="10" fill="#32171c" stroke="#b91c1c"/><text x="1087" y="361" text-anchor="middle" font-size="11" font-weight="800" fill="#f87171">RESTRICT</text><rect x="631" y="414" width="472" height="76" rx="12" fill="#1e1b31" stroke="#6d28d9"/><text x="651" y="442" font-size="12" font-weight="700" fill="#c4b5fd">REPEATED-EVALUATION EVIDENCE</text><text x="651" y="466" font-size="13" font-weight="650" fill="#e2e8f0">model ID · response ID · tokens · latency · trials · failures</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview does not claim real-model safety performance; published results require an executed, version-pinned evaluation run.</text></g></svg>